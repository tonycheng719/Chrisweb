<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星爺台詞百萬挑戰 (百題隨機版)</title>
    <style>
        /* --- 全局變數與重置 --- */
        :root {
            --bg-color: #0a0a1a; /* 深藍黑背景 */
            --panel-bg: #161b33;
            --gold: #ffd700;     /* 經典金色 */
            --gold-dim: #b8860b;
            --text-white: #ffffff;
            --green: #2ecc71;
            --red: #e74c3c;
            --blue: #3498db;
            --disabled: #555555;
        }

        * { box-sizing: border-box; user-select: none; }

        body {
            margin: 0;
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at center, #1a2540 0%, #000000 100%);
            color: var(--text-white);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- 佈局容器 --- */
        #app {
            display: flex;
            height: 100%;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        /* --- 左側：獎金階梯 --- */
        .ladder-panel {
            width: 200px;
            background: rgba(0, 0, 0, 0.6);
            border-right: 2px solid var(--gold-dim);
            display: flex;
            flex-direction: column-reverse; /* 讓第1題在最下面 */
            padding: 20px 10px;
            justify-content: center;
        }

        .ladder-step {
            padding: 5px 10px;
            margin: 2px 0;
            font-size: 14px;
            color: #888;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }

        .ladder-step.active {
            background-color: var(--gold);
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 10px var(--gold);
            transform: scale(1.05);
        }

        .ladder-step.safety {
            color: var(--text-white);
            font-weight: bold;
        }

        .ladder-step.passed {
            color: var(--gold-dim);
        }

        /* --- 中央：遊戲主區 --- */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* --- 頂部資訊 --- */
        .header-info {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 1.2rem;
            color: var(--gold);
            text-shadow: 1px 1px 2px black;
        }

        /* --- 題目區 --- */
        .question-box {
            background: linear-gradient(135deg, #2c3e50, #000);
            border: 3px solid var(--gold);
            border-radius: 15px;
            padding: 30px;
            width: 90%;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 40px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
        }

        .question-cat {
            color: var(--gold);
            font-size: 1rem;
            margin-bottom: 10px;
            border: 1px solid var(--gold);
            padding: 2px 10px;
            border-radius: 20px;
        }

        .question-text {
            font-size: 1.8rem;
            line-height: 1.4;
            font-weight: bold;
        }

        /* --- 選項區 --- */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 90%;
        }

        .option-btn {
            background: #1a1a1a;
            border: 2px solid #555;
            color: white;
            padding: 15px 20px;
            font-size: 1.3rem;
            border-radius: 50px; /* 橢圓形 */
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            position: relative;
            display: flex;
            align-items: center;
        }

        .option-btn::before {
            content: attr(data-index);
            color: var(--gold);
            font-weight: bold;
            margin-right: 15px;
            font-size: 1.4rem;
        }

        .option-btn:hover:not([disabled]) {
            background: #333;
            border-color: var(--gold);
        }

        .option-btn.selected {
            background: var(--gold);
            color: black;
            border-color: white;
        }
        
        .option-btn.correct {
            background: var(--green);
            border-color: white;
            animation: blink 0.5s 3;
        }

        .option-btn.wrong {
            background: var(--red);
            border-color: white;
        }

        @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.5;} 100% {opacity: 1;} }

        /* --- 求助錦囊 --- */
        .lifelines-row {
            margin-top: 40px;
            display: flex;
            gap: 30px;
        }

        .lifeline-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid white;
            background: radial-gradient(circle, #4a90e2, #003366);
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(74, 144, 226, 0.5);
            transition: transform 0.1s;
        }

        .lifeline-btn i { font-size: 20px; margin-bottom: 5px; font-style: normal;}
        .lifeline-btn:active { transform: scale(0.95); }

        .lifeline-btn.used {
            background: var(--disabled);
            border-color: #888;
            cursor: not-allowed;
            opacity: 0.6;
            box-shadow: none;
        }

        /* --- 開始與結束畫面 (Overlay) --- */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .overlay-title {
            font-size: 3.5rem;
            color: var(--gold);
            margin-bottom: 20px;
            text-shadow: 0 0 20px var(--gold-dim);
        }

        .overlay-desc {
            font-size: 1.5rem;
            margin-bottom: 40px;
            max-width: 600px;
            line-height: 1.5;
        }

        .btn-start {
            background: linear-gradient(to bottom, var(--gold), var(--gold-dim));
            border: none;
            padding: 15px 50px;
            font-size: 2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--gold);
            color: #000;
        }
        .btn-start:hover { transform: scale(1.1); }

        /* --- 彈窗 (Modal) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #2c3e50;
            border: 2px solid var(--gold);
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .chart-container {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 150px;
            margin: 20px 0;
        }

        .bar-wrap { display: flex; flex-direction: column; align-items: center; width: 15%; }
        .bar { background: var(--gold); width: 100%; transition: height 1s; }
        .bar-label { margin-top: 5px; color: var(--gold); font-weight: bold; }
        .bar-val { margin-bottom: 5px; font-size: 12px; }

        .phone-msg {
            background: #e5e5ea;
            color: black;
            padding: 15px;
            border-radius: 20px;
            text-align: left;
            font-size: 1.1rem;
            position: relative;
            margin: 20px 0;
        }
        .phone-msg::after {
            content: ''; position: absolute; bottom: -10px; left: 20px;
            border-width: 10px 10px 0; border-style: solid;
            border-color: #e5e5ea transparent;
        }

        /* --- 手機版適配 --- */
        @media (max-width: 768px) {
            .ladder-panel { display: none; } /* 手機隱藏左側列表 */
            .game-area { padding: 10px; }
            .question-text { font-size: 1.4rem; }
            .options-grid { grid-template-columns: 1fr; } /* 單欄顯示 */
            .header-info { font-size: 1rem; }
            .lifeline-btn { width: 60px; height: 60px; font-size: 12px; }
            .overlay-title { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div id="app">
        <div class="ladder-panel" id="ladder"></div>

        <div class="game-area">
            <div class="header-info">
                <span id="current-level-display">第 1 題</span>
                <span id="current-money-display">$0</span>
            </div>

            <div class="question-box">
                <div class="question-cat" id="q-category">周星馳電影</div>
                <div class="question-text" id="q-text">題目載入中...</div>
            </div>

            <div class="options-grid">
                <button class="option-btn" data-index="A" onclick="handleAnswer(0)" id="btn-0">選項 A</button>
                <button class="option-btn" data-index="B" onclick="handleAnswer(1)" id="btn-1">選項 B</button>
                <button class="option-btn" data-index="C" onclick="handleAnswer(2)" id="btn-2">選項 C</button>
                <button class="option-btn" data-index="D" onclick="handleAnswer(3)" id="btn-3">選項 D</button>
            </div>

            <div class="lifelines-row">
                <button class="lifeline-btn" id="ll-5050" onclick="useLifeline('5050')"><i>✂️</i>50:50</button>
                <button class="lifeline-btn" id="ll-poll" onclick="useLifeline('poll')"><i>📊</i>觀眾<br>票選</button>
                <button class="lifeline-btn" id="ll-phone" onclick="useLifeline('phone')"><i>📞</i>電話<br>求助</button>
            </div>
        </div>
    </div>

    <div id="start-screen" class="overlay-screen">
        <div class="overlay-title">星爺台詞<br>百萬挑戰</div>
        <div class="overlay-desc">
            收錄 100 條經典周星馳電影題目！<br>
            每次挑戰隨機抽選 15 題。<br>
            「做人如果冇夢想，同條鹹魚有咩分別？」
        </div>
        <button class="btn-start" onclick="startGame()">開始挑戰</button>
    </div>

    <div id="end-screen" class="overlay-screen" style="display: none;">
        <div class="overlay-title" id="end-title">挑戰失敗</div>
        <div class="overlay-desc" id="end-msg">你獲得了...</div>
        <div style="font-size: 3rem; color: var(--gold); margin-bottom: 30px;" id="final-prize">$0</div>
        <button class="btn-start" onclick="startGame()">重新挑戰</button>
    </div>

    <div id="modal-overlay" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h2 id="modal-title" style="color: var(--gold); margin-top: 0;">標題</h2>
            <div id="modal-body">內容</div>
            <button onclick="closeModal()" style="margin-top:20px; padding: 10px 20px; background: #555; color: white; border: none; cursor: pointer;">關閉</button>
        </div>
    </div>

        function init() {
            const ladderEl = document.getElementById('ladder');
            ladderEl.innerHTML = '';
            for (let i = 0; i < moneyTree.length; i++) {
                const step = document.createElement('div');
                step.className = 'ladder-step';
                if ((i + 1) % 5 === 0) step.classList.add('safety');
                step.innerHTML = `<span>${i + 1}</span> <span>$${moneyTree[i].toLocaleString()}</span>`;
                step.id = `step-${i}`;
                ladderEl.appendChild(step);
            }
        }

        /* --- 隨機抽選題目 --- */
        function getRandomQuestions(count) {
            const pool = [...stephenQuestions]; // 複製一份
            const result = [];
            const n = Math.min(count, pool.length);

            for (let i = 0; i < n; i++) {
                const idx = Math.floor(Math.random() * pool.length);
                result.push(pool[idx]);
                pool.splice(idx, 1); // 移除已選，避免重複
            }
            return result;
        }

        /* --- 遊戲流程 --- */
        function startGame() {
            // 1. 隨機抽選 15 題
            currentSessionQuestions = getRandomQuestions(15);
            
            currentLevel = 0;

            lifelines = { "5050": false, "poll": false, "phone": false };
            
            document.querySelectorAll('.lifeline-btn').forEach(btn => btn.classList.remove('used'));
            document.getElementById('start-screen').style.display = 'none';

            isLocked = false;
            const qData = currentSessionQuestions[currentLevel]; // 從隨機池中取題
            
            document.getElementById('current-level-display').innerText = `第 ${currentLevel + 1} 題`;
            document.getElementById('current-money-display').innerText = 
                currentLevel > 0 ? `$${moneyTree[currentLevel-1].toLocaleString()}` : "$0";
            document.getElementById('q-category').innerText = qData.category;
            document.getElementById('q-text').innerText = qData.question;

            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById(`btn-${i}`);
                btn.innerText = qData.options[i];
                btn.className = 'option-btn';
                btn.style.visibility = 'visible';
                btn.disabled = false;

            updateLadder();

        function updateLadder() {
            for (let i = 0; i < moneyTree.length; i++) {
                const step = document.getElementById(`step-${i}`);
                step.classList.remove('active', 'passed');
                if (i === currentLevel) step.classList.add('active');
                else if (i < currentLevel) step.classList.add('passed');

                stats[correctIndex] = Math.floor(Math.random() * 20) + 60; // 60-80%
                remaining -= stats[correctIndex];

                for (let i = 0; i < 4; i++) {
                    if (i !== correctIndex) {
                        let val = Math.floor(Math.random() * remaining);
                        if (i === 3 || remaining < 5) val = remaining;
                        stats[i] = val;
                        remaining -= val;
                    }
                }
                if (remaining > 0) stats[(correctIndex + 1) % 4] += remaining;
                showPollModal(stats);

            } else if (type === 'phone') {
                const friends = ["達叔", "如花", "醬爆", "石榴姐"];
                const friendName = friends[Math.floor(Math.random() * friends.length)];
                const chars = ["A", "B", "C", "D"];
                
                let suggestedIndex = correctIndex;
                if (Math.random() > 0.85) { // 15% 機率說錯
                    suggestedIndex = (correctIndex + 1) % 4;
                }

                const messages = [
                    `喂？係我呀！呢題我識，肯定係 ${chars[suggestedIndex]}！信我啦！`,
                    `你打俾我做咩呀？借錢免談！...哦問呢題呀？應該係 ${chars[suggestedIndex]} 啩...`,
                    `以我多年行走江湖嘅經驗，呢題九成九係 ${chars[suggestedIndex]}。`,
                    `好大機會係 ${chars[suggestedIndex]}，如果唔係我切頭俾你當凳坐！`
                ];
                const msg = messages[Math.floor(Math.random() * messages.length)];

                showModal("電話求助", `
                    <div style="text-align:center; margin-bottom:10px; font-size:1.2rem; color:var(--gold);">正在通話：${friendName}</div>
                    <div class="phone-msg">${msg}</div>
                `);
            }
        }

        function showPollModal(stats) {
            const chars = ["A", "B", "C", "D"];
            let html = '<div class="chart-container">';
            for (let i = 0; i < 4; i++) {
                html += `
                    <div class="bar-wrap">
                        <div class="bar-val">${stats[i]}%</div>
                        <div class="bar" style="height: ${stats[i] * 1.5}px"></div>
                        <div class="bar-label">${chars[i]}</div>
                    </div>
                `;
            }
            html += '</div>';
            showModal("觀眾票選結果", html);
        }

        function showModal(title, content) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = content;
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        init();
    </script>
</body>
</html>
